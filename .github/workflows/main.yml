name: Build and publish Milk Egg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          foreach ($name in @("idle.png","step.png","heart.png","angel.png","roll.png","rest.png","奶蛋.ico")) {
            if (Test-Path $name) { Copy-Item $name assets }
          }
          if (Test-Path "costumes") {
            Copy-Item "costumes" "assets/costumes" -Recurse -Force
          }
          if (-not (Test-Path "assets/rest.png")) { throw "Missing required asset: rest.png" }
          if (-not (Test-Path "assets/costumes")) { throw "Missing required asset folder: costumes" }
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Build folder version
        shell: cmd
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed
          --name "奶蛋"
          --icon "assets\奶蛋.ico"
          --add-data "assets;assets"
          pet.py
      - name: Verify packaged assets
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/奶蛋/_internal/assets/rest.png")) { throw "Packaged app is missing rest.png" }
          if (-not (Test-Path "dist/奶蛋/_internal/assets/costumes")) { throw "Packaged app is missing costumes" }
          $costumeCount = (Get-ChildItem "dist/奶蛋/_internal/assets/costumes" -Filter "*.png").Count
          if ($costumeCount -lt 26) { throw "Packaged app has only $costumeCount costume images; expected at least 26" }
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/奶蛋" -DestinationPath "naidan-windows.zip" -Force
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pet.py -Pattern '^APP_VERSION="(.+)"$').Matches.Groups[1].Value
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "naidan-windows.zip" --clobber
          } else {
            gh release create $tag "naidan-windows.zip" --title "奶蛋 $tag" --notes "改用文件夹版 ZIP，降低 Windows Defender 对单文件打包的误报概率，并支持 ZIP 自动更新。"
          }
