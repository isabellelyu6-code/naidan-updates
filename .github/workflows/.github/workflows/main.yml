name: Build and publish Milk Egg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          Copy-Item idle.png,step.png,heart.png,angel.png,roll.png,奶蛋.ico assets

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow

      - name: Build EXE
        shell: cmd
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "奶蛋" --icon "assets\奶蛋.ico" --add-data "assets;assets" pet.py

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pet.py -Pattern '^APP_VERSION="(.+)"$').Matches.Groups[1].Value
          $tag = "v$version"
          gh release create $tag "dist/奶蛋.exe" --title "奶蛋 $tag" --notes "奶蛋桌面助手 $tag"
